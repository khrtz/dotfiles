"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "catppuccin_mocha"

# line 1: where am I / git / runtime ............ duration  time
# line 2: ❯
format = """
$directory$git_branch$git_state$git_status$nodejs$python$fill$cmd_duration$time
$character"""

[fill]
symbol = " "

[directory]
style = "bold blue"
format = "[ $path]($style)[$read_only]($read_only_style) "
read_only = " "
read_only_style = "red"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style) "

[git_state]
style = "peach"

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
modified = "±${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "-${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "yellow"
format = "[$symbol$version( \\($virtualenv\\))]($style) "

[cmd_duration]
min_time = 2000
style = "peach"
format = "[⏱ $duration]($style)  "

[time]
disabled = false
style = "overlay0"
time_format = "%H:%M"
format = "[$time]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
